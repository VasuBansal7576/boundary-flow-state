<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Boundary — recording ingest</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="shell"><main class="article" style="padding:50px 0"><div class="eyebrow muted">LOCAL CAPTURE PIPELINE</div><h1>Save the real recording.</h1><p>Captured browser frames are encoded locally. No external upload or paid service.</p><form id="form"><label for="payload">Captured frame payload</label><textarea id="payload" aria-label="Captured frame payload"></textarea><button id="append" type="button" style="margin:15px 15px 0 0">Add frame batch</button><button style="margin-top:15px">Encode local recording</button></form><p id="count">0 frames staged</p><pre id="result" style="white-space:pre-wrap"></pre></main></div><script>let staged=[];document.getElementById('append').onclick=()=>{const field=document.getElementById('payload');try{const data=JSON.parse(field.value);staged.push(...data.frames);field.value='';document.getElementById('count').textContent=staged.length+' frames staged';}catch(e){document.getElementById('result').textContent=e.message}};document.getElementById('form').onsubmit=async e=>{e.preventDefault();const f=document.getElementById('payload');const parsed=f.value?JSON.parse(f.value):{};const payload=JSON.stringify({...parsed,frames:[...staged,...(parsed.frames||[])]});f.value='';document.getElementById('result').textContent='Encoding captured frames locally…';const r=await fetch('/api/recording',{method:'POST',headers:{'Content-Type':'application/json'},body:payload});document.getElementById('result').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
