<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boundary — local integration setup</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="shell"><nav class="nav"><a class="brand" href="/"><span class="mark"></span>boundary / local setup</a><span class="eyebrow muted">PRIVATE CONTROL PLANE</span></nav><main class="article" style="padding:60px 0"><div class="eyebrow muted">ARMORIQ SDK CONNECTION</div><h1>Connect the boundary.</h1><p class="muted">The key stays on this computer. It is never exposed to visiting agents or included in recordings.</p><form id="setup"><label class="eyebrow" for="key">ARMORIQ PLATFORM KEY</label><input id="key" type="password" autocomplete="off" style="display:block;width:100%;padding:16px;margin:16px 0;background:var(--white);border:1px solid var(--line)" required><button>Save local integration</button></form><div id="result" class="result"></div></main></div><script>document.getElementById('setup').onsubmit=async e=>{e.preventDefault();const key=document.getElementById('key');const r=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({api_key:key.value})});key.value='';const result=document.getElementById('result');result.style.display='block';result.textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
