<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boundary / live coordinated256</title><link rel="stylesheet" href="/static/style.css"><style>
body{margin:0;font:13px 'DM Sans',sans-serif;background:var(--paper);color:var(--ink)}main{padding:18px 26px;max-width:1920px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px}.brand{font-size:24px}header span{font:11px 'IBM Plex Mono',monospace}.stats{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);margin:12px 0;background:var(--white)}.stats div{padding:10px 14px;border-right:1px solid var(--line);font-size:10px;color:var(--stone)}.stats b{display:block;font:24px 'IBM Plex Mono',monospace;color:var(--ink)}.arms{display:grid;grid-template-columns:1fr 1fr;gap:20px}section{min-width:0}h2{display:flex;justify-content:space-between;font-size:19px;margin:10px 0}h2 small{font-size:10px;font-weight:400;color:var(--stone)}.numbers{display:flex;justify-content:space-between;gap:8px;background:var(--white);border:1px solid var(--line);padding:9px;font-size:11px}.numbers b{font:18px 'IBM Plex Mono',monospace}.agents{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;padding:8px 0}.agent{height:16px;text-align:center;font:8px/16px 'IBM Plex Mono',monospace;border:1px solid var(--line);background:var(--paper)}.thinking{background:#D8E5F0}.proposed{background:#EFE4CA}.http{background:#E2CB9B}.observed,.done{background:#DFE9DB}.error{background:#F2D6CB}.panel{padding:10px 12px;background:var(--white);border:1px solid var(--line);margin-top:8px;min-height:65px;overflow:hidden}.label{font:10px 'IBM Plex Mono',monospace;color:var(--stone);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}.line{line-height:1.5;overflow-wrap:anywhere}.event{font:11px/1.55 'IBM Plex Mono',monospace}.green{color:var(--forest)}.rust{color:var(--rust)}.tiny{font-size:10px;color:var(--stone)}.peer{font-weight:700}.path{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'IBM Plex Mono',monospace;font-size:11px}.receipt{font:10px/1.5 'IBM Plex Mono',monospace;color:var(--rust)}footer{display:flex;justify-content:space-between;gap:16px;font-size:10px;color:var(--stone);margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.pill{font:11px 'IBM Plex Mono',monospace}.live{color:var(--forest)}@media(min-height:900px){.agent{height:22px;line-height:22px;font-size:10px}.panel{padding:15px;min-height:90px}.line{font-size:15px}.event{font-size:13px}.label{font-size:12px}.path{font-size:13px}.numbers{font-size:13px;padding:12px}.stats b{font-size:30px}.stats div{font-size:13px}.receipt{font-size:12px}.tiny{font-size:12px}}
@media(max-height:850px){main{padding:12px 22px}.agents{gap:2px;padding:6px 0}.agent{height:12px;line-height:12px;font-size:7px}.panel{padding:6px 8px;min-height:0;margin-top:6px}.label{font-size:9px;margin-bottom:3px}.line{font-size:11px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.path{font-size:10px}.receipt{font-size:9px;line-height:1.3}.tiny{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}footer{font-size:9px;margin-top:8px;padding-top:8px}.stats{margin:8px 0}.stats div{padding:7px 12px}.stats b{font-size:22px}h2{margin:7px 0}}</style></head><body><main><header><a class="brand" href="/mass"><span class="mark"></span>boundary <span>/ collective action</span></a><span id="phase">WAITING</span><span><a href="http://127.0.0.1:8171" target="_blank">Website A ↗</a> · <a href="http://127.0.0.1:8172" target="_blank">Website B ↗</a> · <a href="/mass" target="_blank">Full inspector ↗</a></span></header><div class="stats" id="stats"></div><div class="arms" id="arms"></div><footer><span id="run"></span><span>Own actual responses · atomic claims · shared peer evidence · remote ArmorIQ authorization</span><span>Existing Codex subscription · $0 additional paid usage · synthetic local fixtures</span></footer></main><script>
const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),short=x=>(x||'').replace('baseline-agent-','A:').replace('protected-agent-','B:');let busy=false,blocks={};
async function refresh(){if(busy)return;busy=true;try{const d=await fetch('/api/mass').then(r=>r.json());if(!d.arms||!d.run_id)return;document.getElementById('phase').textContent=(d.live?'LIVE':'RECORDED')+' / '+d.phase.toUpperCase()+' / ROUND '+d.round+'/'+d.round_budget;document.getElementById('phase').className=d.live?'pill live':'pill';document.getElementById('run').textContent=d.run_id+' · '+d.orchestrator;let a=Object.values(d.arms),sum=k=>a.reduce((n,v)=>n+(v.summary[k]||0),0);document.getElementById('stats').innerHTML=[[sum('unique_model_threads')+'/'+d.configured_agents,'Persistent Codex agents'],[sum('agents_with_http_responses'),'Agents with real HTTP'],[sum('agents_with_own_feedback'),'Agents given own responses'],[sum('claim_conflicts'),'Duplicate claims sent for replan'],[d.transport.server_http_peaks.total||0,'Measured concurrent server peak']].map(([v,l])=>`<div><b>${E(v)}</b>${l}</div>`).join('');
for(const arm of ['baseline','protected']){let host=document.getElementById(arm);if(!host){host=document.createElement('section');host.id=arm;document.getElementById('arms').append(host)}let v=d.arms[arm],s=v.summary,c=v.coordination||{},p=v.recent_proposals.at(-1),h=(c.handoffs||[]).at(-1),f=(c.self_feedback||[]).at(-1),r=(c.replans||[]).at(-1),latest=v.observations.filter(x=>x.peer!=='controller-bootstrap').at(-1);for(const b of v.decisions||[]){if(b.decision==='block'&&b.attribution==='armoriq')blocks[arm]=b}const b=blocks[arm];host.innerHTML=`<h2>${arm==='baseline'?'A / Control':'B / ArmorIQ backend'}<small>${s.thinking_now} thinking · ${s.http_pending_now} HTTP pending</small></h2><div class="numbers"><span><b>${s.unique_http_work||0}</b> distinct requests</span><span><b>${s.repeated_http_work||0}</b> repeated keys*</span><span class="rust"><b>${s.backend_denials}</b> remote blocks</span><span><b>${s.unauthorized_effects}</b> out-of-scope effects</span></div><div class="agents">${v.peers.map(x=>`<span class="agent ${x.status}" title="${E(x.peer)} · ${x.status} · ${x.responses} real responses">${x.peer.split('-').at(-1)}</span>`).join('')}</div><div class="tiny">District datasets: ${s.partitions_queried||0}/128 read → ${s.partitions_processed||0}/128 processed → ${s.partition_artifacts_saved||0}/128 saved</div>
<div class="panel"><div class="label">Current model choice / actual response</div><div class="line">${p?`<span class="peer">${E(short(p.peer))}</span> chose ${E(p.proposal.subgoal)}`:'Waiting for a model decision'}</div><div class="path">${p?E(p.proposal.method+' '+p.proposal.path):''}</div><div class="tiny">${latest?E(short(latest.peer)+' actual HTTP '+latest.response.status+' · '+latest.proposal.method+' '+latest.proposal.path):'No agent HTTP response yet'}</div></div>
<div class="panel"><div class="label">Peer result → consumer request / verified byte reuse</div>${h?`<div class="line green"><b>${E(short(h.source_peer))} → ${E(short(h.peer))}</b> · ${E(h.reused.field)} = <b>${E(h.reused.value)}</b></div><div class="path">${E(h.consumer?.proposal.method+' '+h.consumer?.proposal.path)} → HTTP ${E(h.consumer?.response.status)}</div><div class="tiny">${E(h.source_id)} → ${E(h.consumer_id)}</div>`:'<div class="line">Awaiting an actual observed peer-result handoff.</div>'}</div>
<div class="panel"><div class="label">Own response delivered → next model action</div>${f?`<div class="line"><b>${E(short(f.peer))}</b> received ${E(f.own_results.slice(-1).map(x=>x.id+' HTTP '+x.response.status).join('; '))}</div><div class="path">Then chose ${E(f.next_proposal?f.next_proposal.method+' '+f.next_proposal.path:'deciding…')}</div>`:'<div class="line">First responses appear in the next model turn.</div>'}</div>
<div class="panel"><div class="label">Atomic claim conflict → model replans / not a security block</div>${r?`<div class="line">${E(short(r.owner))} owns <b>${E(r.work_key)}</b></div><div class="path">${E(short(r.peer))} replanned → ${E(r.next_proposal?r.next_proposal.method+' '+r.next_proposal.path:'deciding…')}</div>`:'<div class="line">No conflicting claims yet.</div>'}</div>
<div class="panel"><div class="label">${arm==='protected'?'Actual remote enforcement receipt':'Execution control'}</div>${arm==='protected'?(b?`<div class="receipt">${E(b.action)} · ${E(short(b.actor))}<br>${E(b.detail.backend.response.reason)}<br>x-request-id ${E(b.detail.backend.response_ids?.['x-request-id'])}</div>`:'Waiting for a real policy block; no result fabricated.'):'Scope gate off. Same fixtures, mission and coordination protocol.'}<div class="tiny">Infrastructure failures: ${s.infrastructure_failures} · model errors: ${s.agent_errors} · *Includes bounded503/transport retries.</div></div>`;}
}catch(e){document.getElementById('phase').textContent='Evidence unavailable: '+e.message}finally{busy=false}}
refresh();setInterval(refresh,1500);
</script></body></html>
