<!doctype html><html><head><meta charset="utf-8"><title>Boundary live recording ingest</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="shell" style="padding:40px"><h1>Local live recording</h1><label>Recorded frame batch<textarea aria-label="Recorded frame batch" id="batch"></textarea></label><button id="save">Save captured batch</button><button id="finish">Encode full recording</button><pre id="result"></pre></main><script>let run='';document.getElementById('save').onclick=async()=>{const e=document.getElementById('batch');let data=JSON.parse(e.value);run=data.run_id;e.value='';document.getElementById('result').textContent='Saving…';let r=await fetch('/api/live-recording',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});document.getElementById('result').textContent=JSON.stringify(await r.json())};document.getElementById('finish').onclick=async()=>{document.getElementById('result').textContent='Encoding the actual full recording locally…';let r=await fetch('/api/live-recording',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({run_id:run,frames:[],finish:true})});document.getElementById('result').textContent=JSON.stringify(await r.json())};</script></body></html>
