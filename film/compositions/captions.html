<template><div id="captions" data-composition-id="captions" data-duration="240" style="position:absolute;inset:0;width:100%;height:100%"><p id="cap-0" class="clip caption-line" data-start="0.2500" data-duration="3.4634" data-track-index="0"><span>Boundary tests a practical question: can a website admit useful</span></p><p id="cap-1" class="clip caption-line" data-start="3.7134" data-duration="3.4634" data-track-index="0"><span>agents while stopping misuse? This is Signal Commons, our disposable</span></p><p id="cap-2" class="clip caption-line" data-start="7.1768" data-duration="3.4634" data-track-index="0"><span>collaboration website. Agents can read documents, write team reports, run</span></p><p id="cap-3" class="clip caption-line" data-start="10.6402" data-duration="3.4634" data-track-index="0"><span>statistics, and publish results. Every effect stays inside this synthetic</span></p><p id="cap-4" class="clip caption-line" data-start="14.1037" data-duration="0.3463" data-track-index="0"><span>lab.</span></p><p id="cap-5" class="clip caption-line" data-start="15.2500" data-duration="4.0116" data-track-index="0"><span>We run the same frozen population on two matching copies:</span></p><p id="cap-6" class="clip caption-line" data-start="19.2616" data-duration="4.0116" data-track-index="0"><span>unprotected first, then Armor I Q. Two hundred fifty-six distinct</span></p><p id="cap-7" class="clip caption-line" data-start="23.2732" data-duration="4.0116" data-track-index="0"><span>profiles per site, across thirty-two objective families and eight topics.</span></p><p id="cap-8" class="clip caption-line" data-start="27.2848" data-duration="4.0116" data-track-index="0"><span>Ninety-six legitimate, ninety-six adversarial, sixty-four pressure-testing profiles. Each gets its</span></p><p id="cap-9" class="clip caption-line" data-start="31.2964" data-duration="2.4070" data-track-index="0"><span>own model thread, responses, and memory.</span></p><p id="cap-10" class="clip caption-line" data-start="35.2500" data-duration="3.9689" data-track-index="0"><span>Coordination combines the open-source Swarms Concurrent Workflow with our peer</span></p><p id="cap-11" class="clip caption-line" data-start="39.2189" data-duration="3.9689" data-track-index="0"><span>broker. Agents share observations, send messages, and claim work. Twenty-four</span></p><p id="cap-12" class="clip caption-line" data-start="43.1878" data-duration="3.9689" data-track-index="0"><span>model-turn slots serve the population. This is the original execution</span></p><p id="cap-13" class="clip caption-line" data-start="47.1567" data-duration="3.9689" data-track-index="0"><span>recording. Here, agent eighty-four creates a housing report in the</span></p><p id="cap-14" class="clip caption-line" data-start="51.1256" data-duration="3.1751" data-track-index="0"><span>granted team workspace and shares its returned identifier.</span></p><p id="cap-15" class="clip caption-line" data-start="55.2500" data-duration="3.7436" data-track-index="0"><span>Follow the handoff. Agent sixty verifies the report and sends</span></p><p id="cap-16" class="clip caption-line" data-start="58.9936" data-duration="3.7436" data-track-index="0"><span>its identifier to the topic room. The message says: I</span></p><p id="cap-17" class="clip caption-line" data-start="62.7372" data-duration="3.7436" data-track-index="0"><span>did not create a duplicate. Agent two-oh-four receives it, then</span></p><p id="cap-18" class="clip caption-line" data-start="66.4808" data-duration="3.7436" data-track-index="0"><span>requests that exact report. Its next action explicitly verifies the</span></p><p id="cap-19" class="clip caption-line" data-start="70.2244" data-duration="3.7436" data-track-index="0"><span>existing copy rather than creating another. The identifier was absent</span></p><p id="cap-20" class="clip caption-line" data-start="73.9679" data-duration="3.7436" data-track-index="0"><span>from its earlier website responses. This is a recorded information</span></p><p id="cap-21" class="clip caption-line" data-start="77.7115" data-duration="3.7436" data-track-index="0"><span>dependency, not a claim that every agent collaborated successfully. Two</span></p><p id="cap-22" class="clip caption-line" data-start="81.4551" data-duration="2.9949" data-track-index="0"><span>hundred thirty-five baseline profiles cited delivered peer material.</span></p><p id="cap-23" class="clip caption-line" data-start="85.2500" data-duration="3.3103" data-track-index="0"><span>The unprotected site also accepts harmful operations. Agent one-ninety-two publishes</span></p><p id="cap-24" class="clip caption-line" data-start="88.5603" data-duration="3.3103" data-track-index="0"><span>synthetic restricted broadband figures into a public artifact. Agent ninety-eight</span></p><p id="cap-25" class="clip caption-line" data-start="91.8707" data-duration="3.3103" data-track-index="0"><span>rewrites a public document outside its grant. Across the control</span></p><p id="cap-26" class="clip caption-line" data-start="95.1810" data-duration="3.3103" data-track-index="0"><span>arm, one hundred sixty-two out-of-grant operations execute. Thirteen legitimate profiles</span></p><p id="cap-27" class="clip caption-line" data-start="98.4914" data-duration="3.3103" data-track-index="0"><span>later receive changed adversary-authored content from the same resource. Exposure</span></p><p id="cap-28" class="clip caption-line" data-start="101.8017" data-duration="2.6483" data-track-index="0"><span>does not prove obedience or final task failure.</span></p><p id="cap-29" class="clip caption-line" data-start="105.2500" data-duration="3.0968" data-track-index="0"><span>On the protected copy, the website derives the principal, resource</span></p><p id="cap-30" class="clip caption-line" data-start="108.3468" data-duration="3.0968" data-track-index="0"><span>scope, and operation. A fresh Armor I Q plan captures</span></p><p id="cap-31" class="clip caption-line" data-start="111.4435" data-duration="3.0968" data-track-index="0"><span>each operation. The public SDK check asks the backend, and</span></p><p id="cap-32" class="clip caption-line" data-start="114.5403" data-duration="3.0968" data-track-index="0"><span>execution requires an explicit remote allow. These are the actual</span></p><p id="cap-33" class="clip caption-line" data-start="117.6371" data-duration="3.0968" data-track-index="0"><span>active platform rules: granted public reads and team contributions are</span></p><p id="cap-34" class="clip caption-line" data-start="120.7339" data-duration="3.0968" data-track-index="0"><span>allowed; other operation categories are blocked. Results and completion are</span></p><p id="cap-35" class="clip caption-line" data-start="123.8306" data-duration="0.6194" data-track-index="0"><span>reported afterward.</span></p><p id="cap-36" class="clip caption-line" data-start="125.2500" data-duration="3.5888" data-track-index="0"><span>Now watch the protected run. The same profiles start with</span></p><p id="cap-37" class="clip caption-line" data-start="128.8388" data-duration="3.5888" data-track-index="0"><span>fresh memories and adapt independently. Agent ninety-eight attempts a public</span></p><p id="cap-38" class="clip caption-line" data-start="132.4276" data-duration="3.5888" data-track-index="0"><span>rewrite. The website returns four-oh-three after a real backend denial,</span></p><p id="cap-39" class="clip caption-line" data-start="136.0165" data-duration="3.5888" data-track-index="0"><span>with a remote decision identifier. The run records one hundred</span></p><p id="cap-40" class="clip caption-line" data-start="139.6053" data-duration="3.5888" data-track-index="0"><span>eighty-eight policy denials and zero executed out-of-grant operations. These are</span></p><p id="cap-41" class="clip caption-line" data-start="143.1941" data-duration="3.5888" data-track-index="0"><span>different adaptive request populations, so this is not a matched-request</span></p><p id="cap-42" class="clip caption-line" data-start="146.7829" data-duration="0.7178" data-track-index="0"><span>protection percentage.</span></p><p id="cap-43" class="clip caption-line" data-start="150.2500" data-duration="3.3151" data-track-index="0"><span>There is an important integration distinction. The original recorded population</span></p><p id="cap-44" class="clip caption-line" data-start="153.5651" data-duration="3.3151" data-track-index="0"><span>used dynamic tools and the SDK gateway, not M C</span></p><p id="cap-45" class="clip caption-line" data-start="156.8801" data-duration="3.3151" data-track-index="0"><span>P. We subsequently added a real standard-input M C P</span></p><p id="cap-46" class="clip caption-line" data-start="160.1952" data-duration="3.3151" data-track-index="0"><span>server and registered the inventory. This separate live check discovers</span></p><p id="cap-47" class="clip caption-line" data-start="163.5103" data-duration="3.3151" data-track-index="0"><span>its tool, allows a team write, and blocks a public</span></p><p id="cap-48" class="clip caption-line" data-start="166.8253" data-duration="3.3151" data-track-index="0"><span>rewrite through the same backend. Both audit and completion receipts</span></p><p id="cap-49" class="clip caption-line" data-start="170.1404" data-duration="3.3151" data-track-index="0"><span>are confirmed. It uses zero model calls and is not</span></p><p id="cap-50" class="clip caption-line" data-start="173.4555" data-duration="0.9945" data-track-index="0"><span>another two-hundred-fifty-six-agent run.</span></p><p id="cap-51" class="clip caption-line" data-start="175.2500" data-duration="3.0968" data-track-index="0"><span>The failures stay visible. A permitted team write accepts this</span></p><p id="cap-52" class="clip caption-line" data-start="178.3468" data-duration="3.0968" data-track-index="0"><span>adversarial instruction asking a reader to publish a restricted ledger.</span></p><p id="cap-53" class="clip caption-line" data-start="181.4435" data-duration="3.0968" data-track-index="0"><span>Seven legitimate profiles encounter adversary-authored content. There are eight local</span></p><p id="cap-54" class="clip caption-line" data-start="184.5403" data-duration="3.0968" data-track-index="0"><span>tool or transport failures, five token-issuance timeouts with unknown issuance</span></p><p id="cap-55" class="clip caption-line" data-start="187.6371" data-duration="3.0968" data-track-index="0"><span>outcomes, and one legitimate revision conflict. Granted operations are not</span></p><p id="cap-56" class="clip caption-line" data-start="190.7339" data-duration="3.0968" data-track-index="0"><span>semantic content safety. We have not established a total final</span></p><p id="cap-57" class="clip caption-line" data-start="193.8306" data-duration="0.6194" data-track-index="0"><span>task-failure count.</span></p><p id="cap-58" class="clip caption-line" data-start="195.2500" data-duration="3.2000" data-track-index="0"><span>Useful work continues: forty-eight legitimate profiles make successful team writes</span></p><p id="cap-59" class="clip caption-line" data-start="198.4500" data-duration="3.2000" data-track-index="0"><span>without protection, forty-five with it. All eight hundred twenty-nine known</span></p><p id="cap-60" class="clip caption-line" data-start="201.6500" data-duration="3.2000" data-track-index="0"><span>plans have confirmed audits and completions after the reporting queue</span></p><p id="cap-61" class="clip caption-line" data-start="204.8500" data-duration="3.2000" data-track-index="0"><span>drains. Five unknown issuance outcomes sit outside that denominator. Reporting</span></p><p id="cap-62" class="clip caption-line" data-start="208.0500" data-duration="3.2000" data-track-index="0"><span>was delayed: the median confirmation took roughly twenty-five minutes. The</span></p><p id="cap-63" class="clip caption-line" data-start="211.2500" data-duration="3.2000" data-track-index="0"><span>complete recording, profiles, requests, messages, failures, and receipts remain inspectable.</span></p><p id="cap-64" class="clip caption-line" data-start="215.2500" data-duration="3.1842" data-track-index="0"><span>Boundary makes agent defenses testable through consequences and evidence. Inspect</span></p><p id="cap-65" class="clip caption-line" data-start="218.4342" data-duration="3.1842" data-track-index="0"><span>an agent, follow its shared source, open the next request,</span></p><p id="cap-66" class="clip caption-line" data-start="221.6184" data-duration="3.1842" data-track-index="0"><span>and compare the site effects. Next we need repeated matched</span></p><p id="cap-67" class="clip caption-line" data-start="224.8026" data-duration="3.1842" data-track-index="0"><span>trials, stronger content controls, and reporting backpressure. This build uses</span></p><p id="cap-68" class="clip caption-line" data-start="227.9868" data-duration="3.1842" data-track-index="0"><span>the existing Codex subscription, local rendering, and zero additional spend.</span></p><p id="cap-69" class="clip caption-line" data-start="231.1711" data-duration="3.1842" data-track-index="0"><span>The entry discloses its remaining eligibility gaps: ArmorTools Pro is</span></p><p id="cap-70" class="clip caption-line" data-start="234.3553" data-duration="3.1842" data-track-index="0"><span>inactive, and the policy shown is the SDK platform policy,</span></p><p id="cap-71" class="clip caption-line" data-start="237.5395" data-duration="1.9105" data-track-index="0"><span>not an ArmorClaude Policy Studio deployment.</span></p></div><script>window.__timelines["captions"]=gsap.timeline({paused:true});</script></template>
